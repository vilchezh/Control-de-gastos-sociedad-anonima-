<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a6df4"><title>Gastos con mi socio</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--ac:#2a6df4;--ok:#12805c;--bad:#c0392b;--bd:#e3e6eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f29;--tx:#eef1f6;--mu:#98a2b3;--ac:#4b82f0;--ok:#43c59e;--bad:#ff7a6b;--bd:#2c3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:620px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:14px;color:var(--mu);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}button.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);width:auto;padding:4px 10px;font-weight:400;font-size:12px;margin:4px 0 0}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.r{text-align:right;white-space:nowrap}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Gastos con mi socio <span><button class="sec" id="cc" hidden>Cambiar conexión</button> <button class="sec" id="out" hidden>Salir</button></span></h1>

<div id="setup" class="card" hidden><b>Conexión (una sola vez)</b><p class="mu">Pega los datos de Supabase (Project Settings → API).</p>
<input id="su" placeholder="Project URL (https://xxxx.supabase.co)"><input id="sk" placeholder="anon public key"><button id="ss">Guardar</button></div>

<div id="login" class="card" hidden><b>Entrar</b><p class="mu">Solo funcionan los correos de los socios.</p>
<input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña (mín. 6)">
<div class="row"><button id="bin">Entrar</button><button id="bup" style="background:var(--mu)">Crear cuenta</button></div><div id="lm" class="mu"></div></div>

<div id="app" hidden>
<div class="card"><div class="mu">Saldo entre ustedes</div><div id="bal" class="big">—</div><div id="balars" class="mu"></div><div id="settle" style="margin-top:10px"></div></div>
<h2>Cotización (ARS por USD)</h2>
<div class="card"><div class="row"><select id="kind"><option value="blue">Dólar blue</option><option value="bolsa">Dólar MEP</option><option value="oficial">Dólar oficial</option></select><input id="rate" inputmode="decimal" placeholder="Ej: 1400"></div>
<div class="row" style="align-items:center"><div class="mu" id="rmeta" style="flex:3"></div><button class="sec" id="rf" style="flex:1">↻ Actualizar</button></div></div>
<h2>Nuevo gasto</h2>
<div class="card"><input id="desc" placeholder="Concepto (ej: Claude Pro)">
<div class="row"><input id="usd" inputmode="decimal" placeholder="Monto en USD"><select id="cat"><option>IA</option><option>Publicidad</option><option>Stock</option><option>Otro</option></select></div>
<div class="row"><select id="mode"><option value="eq">Mitad y mitad</option><option value="pct">% personalizado</option></select><input id="pct" inputmode="decimal" placeholder="% de la otra persona" hidden></div>
<div class="mu" style="margin-bottom:8px">Pagué yo. La otra persona me debe su parte.</div><button id="add">Agregar gasto</button></div>
<h2>Por categoría</h2><div class="card" id="cats"></div>
<h2>Historial</h2><div class="card" id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='',SUPABASE_KEY=''; // opcional: pegalos acá y no hace falta el paso de conexión
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(n,d=2)=>Number(n).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let sb,me,gastos=[],pagos=[],rates={},kind=ls('kind')||'blue';
const rate=()=>Number(rates[kind])||0,ars=u=>rate()?'≈ $ '+f(u*rate(),0):'';
const who=e=>e===me?'Vos':String(e).split('@')[0];
const two=(b,label,fn)=>{b.onclick=()=>{if(b.dataset.s)fn();else{b.dataset.s=1;b.textContent='¿Seguro?';setTimeout(()=>{delete b.dataset.s;b.textContent=label},3000)}}};
const show=id=>{['setup','login','app'].forEach(i=>$('#'+i).hidden=i!==id);$('#cc').hidden=id==='setup'};
$('#cc').onclick=()=>{ls('su','');ls('sk','');location.reload()};

function net(){let n=0;gastos.forEach(g=>{const o=g.usd*g.owed_pct/100;n+=g.payer===me?o:-o});
 pagos.forEach(p=>{n+=(p.dir==='paid')===(p.by_email===me)?+p.usd:-p.usd});return Math.round(n*100)/100}

function render(){
 const n=net(),b=$('#bal');b.className='big '+(n>0?'ok':n<0?'bad':'');
 b.textContent=n===0?'Están a mano':(n>0?'Te deben US$ ':'Debés US$ ')+f(Math.abs(n));
 $('#balars').textContent=n?(rate()?ars(Math.abs(n))+' ('+kind+')':'Cargá la cotización para ver pesos'):'';
 const s=$('#settle');s.innerHTML='';
 if(n){const bt=document.createElement('button');bt.textContent=n<0?'Registrar que pagué':'Registrar que me pagaron';s.append(bt);two(bt,bt.textContent,()=>settle(n))}
 const L=$('#list');L.innerHTML=gastos.length+pagos.length?'':'<div class="mu">Todavía no hay movimientos.</div>';
 [...gastos.map(g=>({t:'g',ts:g.created_at,g})),...pagos.map(p=>({t:'p',ts:p.created_at,p}))].sort((a,b)=>b.ts<a.ts?-1:1).forEach(it=>{
  const d=document.createElement('div');d.className='item';const dt=new Date(it.ts).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  if(it.t==='g'){const g=it.g;d.innerHTML=`<div><b>${esc(g.descr)}</b><div class="mu">${esc(g.cat)} · pagó ${esc(who(g.payer))} · ${dt}<br>Parte del otro: ${g.owed_pct}% = US$ ${f(g.usd*g.owed_pct/100)}</div></div><div class="r"><b>US$ ${f(g.usd)}</b><div class="mu">${ars(g.usd)}</div></div>`;
   if(g.payer===me){const x=document.createElement('button');x.className='sec';x.textContent='Borrar';d.lastChild.append(x);two(x,'Borrar',async()=>{await sb.from('gastos').delete().eq('id',g.id);load()})}}
  else{const p=it.p,mine=p.by_email===me,paid=(p.dir==='paid')===mine;d.innerHTML=`<div><b>Pago registrado</b><div class="mu">${paid?'Pagaste':'Te pagaron'} · ${dt}${p.rate?' · dólar '+esc(p.kind)+' $'+f(p.rate,0):''}</div></div><div class="r"><b>US$ ${f(p.usd)}</b><div class="mu">${p.rate?'$ '+f(p.usd*p.rate,0):''}</div></div>`}
  L.append(d)});
 const c={};gastos.forEach(g=>c[g.cat]=(c[g.cat]||0)+ +g.usd);
 $('#cats').innerHTML=Object.keys(c).length?Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><span class="r">US$ ${f(v)} <span class="mu">${ars(v)}</span></span></div>`).join(''):'<div class="mu">Sin datos aún.</div>';
 if(document.activeElement!==$('#rate'))$('#rate').value=rates[kind]||'';
}
async function load(){
 const [g,p,c]=await Promise.all([sb.from('gastos').select('*'),sb.from('pagos').select('*'),sb.from('config').select('*').eq('id',1).maybeSingle()]);
 if(g.error){$('#rmeta').textContent='Error: '+g.error.message+' (¿corriste setup.sql y tu correo está en socios?)';return}
 gastos=g.data;pagos=p.data;if(c.data)rates={...c.data,...rates};render()}
async function fetchRates(){
 try{const d=await (await fetch('https://dolarapi.com/v1/dolares')).json(),r={};
  d.forEach(x=>{if(['blue','bolsa','oficial'].includes(x.casa))r[x.casa]=x.venta});
  rates={...rates,...r};await sb.from('config').update(r).eq('id',1);
  $('#rmeta').textContent='Cotización automática (venta) · '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
 catch(e){$('#rmeta').textContent='Sin conexión a la API: se usa el último valor guardado'}render()}
async function settle(n){await sb.from('pagos').insert({dir:n<0?'paid':'received',usd:Math.abs(n),rate:rate()||null,kind});load()}

const KW={IA:['claude','chatgpt','gpt','openai','anthropic','gemini','midjourney','cursor','copilot','perplexity'],Publicidad:['publicidad','ads','anuncio','facebook','instagram','tiktok','campa[ñn]a','influencer'],Stock:['stock','mercader','inventario','proveedor','insumo']};
let manual=false;
const guess=t=>{t=t.toLowerCase().trim();if(!t)return null;const h=gastos.find(g=>g.descr.toLowerCase().trim()===t);if(h)return h.cat;
 for(const c in KW)if(KW[c].some(k=>new RegExp('\\b'+k,'i').test(t)))return c;return 'Otro'};
$('#desc').oninput=()=>{if(!manual){const c=guess($('#desc').value);if(c)$('#cat').value=c}};
$('#cat').onchange=()=>manual=true;
$('#mode').onchange=()=>$('#pct').hidden=$('#mode').value==='eq';
$('#kind').value=kind;$('#kind').onchange=()=>{kind=$('#kind').value;ls('kind',kind);render()};
$('#rf').onclick=fetchRates;
$('#rate').onchange=async()=>{const v=parseFloat($('#rate').value.replace(',','.'));if(v>0){rates[kind]=v;await sb.from('config').update({[kind]:v}).eq('id',1);$('#rmeta').textContent='Cotización manual';render()}};
$('#add').onclick=async()=>{const usd=parseFloat($('#usd').value.replace(',','.')),descr=$('#desc').value.trim(),pct=$('#mode').value==='eq'?50:parseFloat($('#pct').value.replace(',','.'));
 if(!descr||!(usd>0)||!(pct>=0&&pct<=100)){alert('Revisá concepto, monto y porcentaje');return}
 const {error}=await sb.from('gastos').insert({descr,usd,cat:$('#cat').value,owed_pct:pct,rate:rate()||null,kind});
 if(error){alert(error.message);return}$('#desc').value='';$('#usd').value='';manual=false;load()};

async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){show('login');return}
 me=session.user.email.toLowerCase();show('app');$('#out').hidden=false;
 await load();fetchRates();
 sb.channel('x').on('postgres_changes',{event:'*',schema:'public'},load).subscribe()}
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
const auth=async up=>{$('#lm').textContent='…';const a={email:$('#em').value.trim(),password:$('#pw').value};
 const {error,data}=up?await sb.auth.signUp(a):await sb.auth.signInWithPassword(a);
 if(error){$('#lm').textContent=error.message;return}
 if(up&&!data.session){$('#lm').textContent='Revisá tu correo para confirmar la cuenta y luego entrá.';return}start()};
$('#bin').onclick=()=>auth(false);$('#bup').onclick=()=>auth(true);
$('#ss').onclick=()=>{ls('su',$('#su').value.trim());ls('sk',$('#sk').value.trim());location.reload()};
const U=SUPABASE_URL||ls('su'),K=SUPABASE_KEY||ls('sk');
if(!U||!K)show('setup');else{sb=supabase.createClient(U,K);start()}
</script></main></body></html>
